# Build Lacuna on every platform we claim to support.
#
# Why this exists: the code had only ever been compiled on Windows. That says
# nothing about Linux or macOS — a path separator, a missing system library or an
# OS-gated dependency will not show up locally, and the first person to find out
# would have been someone at a conference trying to run it. This turns "should
# work everywhere" into "did build everywhere, on this commit".
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push supersedes an in-flight run of the same ref. The matrix is wide;
# without this two quick pushes double the queue for no extra information.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms when one fails — the whole point is to
      # see every platform's result on a given commit.
      fail-fast: false
      matrix:
        include:
          # ── portable GPU build (wgpu + ort), the default feature set ────────
          # wgpu reaches NVIDIA, AMD, Intel and Apple silicon via
          # Vulkan/Metal/DX12, where the old CUDA default reached NVIDIA only.
          - { os: windows-latest, name: windows-x64,       features: "" }
          - { os: ubuntu-latest,  name: linux-x64,         features: "" }
          - { os: macos-14,       name: macos-arm64,       features: "" }
          # Intel Mac by CROSS-COMPILING from the arm64 runner, not by asking for
          # an Intel one. `macos-13` is GitHub's deprecated Intel image: the first
          # run left both x64 jobs `queued` with no runner assigned for 92 minutes
          # before being cancelled, while their arm64 equivalents finished in 9-12
          # minutes. Cross-compiling depends on nothing but the toolchain, so it
          # cannot be starved of capacity. Both slices come from the same Xcode
          # SDK, and ort keys its prebuilt off the target triple, so this fetches
          # the x64-osx runtime exactly as a native Intel build would.
          - { os: macos-14,       name: macos-x64,         features: "", target: x86_64-apple-darwin }

          # ── CPU-only build ─────────────────────────────────────────────────
          # This is what gets handed to people at a conference on their own
          # laptops, so it needs its own evidence on every platform.
          # `ort-backend` pulls a PREBUILT ONNX Runtime per target, and whether
          # that resolves for linux-x64, macos-arm64 and macos-x64 has never been
          # tested. Measured on Windows it is worth 7.1x over the pure-Rust
          # fallback (530 vs 4114 ms per DINO tile), so it matters whether it
          # works — but we need to KNOW, not assume.
          - { os: windows-latest, name: windows-x64-cpu,   features: "--no-default-features --features ort-backend" }
          - { os: ubuntu-latest,  name: linux-x64-cpu,     features: "--no-default-features --features ort-backend" }
          - { os: macos-14,       name: macos-arm64-cpu,   features: "--no-default-features --features ort-backend" }
          - { os: macos-14,       name: macos-x64-cpu,     features: "--no-default-features --features ort-backend", target: x86_64-apple-darwin }

          # ── CUDA / NVIDIA build ────────────────────────────────────────────
          # Windows and Linux ONLY. There is no macOS row and there cannot be:
          # Apple dropped NVIDIA driver support years ago and Apple Silicon has
          # no NVIDIA hardware at all, so on Mac the GPU path IS wgpu (Metal).
          #
          # We only COMPILE here — the runners have no GPU, so this proves the
          # CUDA feature builds, not that it runs. Linux CUDA has never been
          # built anywhere, and nobody on the project has a Linux machine to try
          # it on, so CI is the only route to that binary existing at all.
          - { os: windows-latest, name: windows-x64-cuda,  features: "--no-default-features --features cuda,ort-backend", cuda: true }
          - { os: ubuntu-latest,  name: linux-x64-cuda,    features: "--no-default-features --features cuda,ort-backend", cuda: true }

          # ── the fallback, proved separately ────────────────────────────────
          # Pure-Rust burn ndarray, no ONNX Runtime at all. ~7x slower, but it
          # depends on nothing but the Rust toolchain, so it is what we ship if
          # the ort prebuilt turns out not to resolve above. Worth knowing it
          # builds BEFORE we need it rather than during the week of the demo.
          # macOS x64 is covered by the arm64 job here: same source, same crates.
          - { os: ubuntu-latest,  name: linux-x64-burn,    features: "--no-default-features" }
          - { os: macos-14,       name: macos-arm64-burn,  features: "--no-default-features" }

    # `--target` changes where cargo puts the binary, so both the flag and the
    # output directory are derived from one place. Empty `matrix.target` means a
    # native build and both collapse to their usual values.
    env:
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      BIN_DIR: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}

    steps:
      - uses: actions/checkout@v4

      # egui/eframe need X11, Wayland, GL and GTK headers on Linux; without them
      # the build fails at link time with errors that look like Rust problems but
      # are not.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libgtk-3-dev

      # burn-cuda needs the CUDA SDK to build (it compiles kernels through nvrtc
      # at runtime, but still links against the runtime libraries). Only the two
      # cuda rows pay this ~3-5 GB install.
      - name: CUDA toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.0'
          method: network
          sub-packages: '["nvcc", "cudart", "nvrtc", "nvrtc_dev"]'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Type-check first: it fails in ~1 minute instead of ~15 and reports every
      # error at once rather than stopping at the first codegen failure.
      # --locked so a lockfile that drifted is a CI failure, not a silent update.
      - name: cargo check
        run: cargo check --locked --all-targets $TARGET_FLAG ${{ matrix.features }}
        shell: bash

      - name: cargo build --release
        run: cargo build --locked --release $TARGET_FLAG ${{ matrix.features }}
        shell: bash

      # Report what the binary dynamically links against, WITHOUT running it.
      #
      # Deliberately not executing it: main.rs only intercepts known subcommands
      # and otherwise falls through to eframe::run_native, so any stray argument
      # launches a GUI — which on a headless runner either fails confusingly or
      # hangs the job until the 6h timeout. Inspecting the link table proves the
      # thing this actually needs to prove (that every dependency resolves on
      # this platform) and cannot hang.
      #
      # On Windows this is where a missing DirectML would show up: ort-sys links
      # it dynamically in every variant, and it is only an inbox component from
      # Win10 1903 onward.
      - name: Inspect binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$BIN_DIR/lacuna"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          ls -l "$BIN"
          file "$BIN" || true
          case "${{ runner.os }}" in
            Linux)   ldd    "$BIN" || true ;;
            macOS)   otool -L "$BIN" || true ;;
            Windows) echo "(no dependency dump on Windows runners)" ;;
          esac

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lacuna-${{ matrix.name }}
          # Models are NOT included — they are ~800 MB and belong on a release,
          # not in a CI artifact. The app finds them next to the executable at
          # runtime (see src/paths.rs), so a user drops models/ beside it.
          path: |
            ${{ env.BIN_DIR }}/lacuna
            ${{ env.BIN_DIR }}/lacuna.exe
          if-no-files-found: error
          retention-days: 14
