[package]
name = "lacuna"
version = "0.5.0"
edition = "2021"
authors = ["Tobias Müller"]
# AGPL-3.0 because Lacuna incorporates a model trained with Ultralytics YOLO,
# which is AGPL-3.0 — see THIRD_PARTY_LICENSES.md. Distributing Lacuna therefore
# carries the obligation to make its corresponding source available to
# recipients under the same terms.
license = "AGPL-3.0-only"
description = "Lacuna — a Rust toolkit for reading leaves: segmentation, anomaly detection, reconstruction, and shape-complexity morphology."

[[bin]]
name = "lacuna"
path = "src/main.rs"

# ── Backend feature flags ──────────────────────────────────────────────────────
# ALL nets (DINOv3, YOLO26, recon) now run on BURN — one backend, no onnxruntime.
# cuda     (default) — NVIDIA GPU via CUDA driver + nvrtc.  No cuDNN, no ort DLLs.
# wgpu-gpu           — GPU via Vulkan/DX12/Metal (cross-platform, no CUDA needed).
# <none>             — CPU via burn's ndarray backend.  Slow but fully portable.
#
# Windows GPU:       cargo build --release                (uses cuda, self-contained)
# Cross-platform GPU:cargo build --release --no-default-features --features wgpu-gpu
# Portable CPU demo: cargo build --release --no-default-features
#
# ort-backend/ort-cuda/directml — OPTIONAL: re-add the old ONNX Runtime path for
#   DINO/YOLO (and its native DLLs) as a fallback. Compile it, then set
#   LACUNA_USE_ORT=1 to select ort for THOSE two models.
# `ort` the CRATE is a plain always-on dependency now (see [dependencies] below) —
#   Field Review's interactive SAM click tool uses it unconditionally, so the
#   ONNX Runtime native DLLs ARE part of every build regardless of these
#   features. DINO/YOLO still default to BURN either way; these features only
#   control whether THOSE TWO specifically can be switched to ort at runtime.
[features]
default  = ["wgpu-gpu", "ort-backend"]
# ── BURN backends (DINOv3 + YOLO26 run pure-Rust; NO onnxruntime/cuDNN DLLs) ──
# Portable by default. `cuda` stays available and is what you want on this
# machine (`--no-default-features --features cuda,ort-backend`), but it must not
# be what a stranger gets: it is NVIDIA-only and fails on every Mac.
cuda     = ["dep:burn-cuda"]   # NVIDIA GPU via CUDA driver + nvrtc (no cuDNN)
wgpu-gpu = ["burn/wgpu"]       # any GPU via Vulkan/DX12/Metal
# ── Optional ONNX Runtime backend for DINO/YOLO specifically (SAM always uses
# ort regardless of these — see the dependency comment above) ──
ort-backend = []                               # ort CPU EP for DINO/YOLO
ort-cuda    = ["ort-backend", "ort/cuda"]      # + CUDA EP (needs cuDNN)
directml    = ["ort-backend", "ort/directml"]  # + DirectML EP (no cuDNN)

[dependencies]
eframe     = { version = "0.29", features = ["persistence"] }
egui       = "0.29"
image      = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
imageproc  = "0.25"   # contour tracing for Field Review's YOLO polygon export
rayon      = "1"
rfd        = "0.14"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir    = "2"
rand       = { version = "0.8", features = ["small_rng"] }
dirs       = "5"
# ndarray always compiled in — provides the CPU fallback path.
burn       = { version = "0.16", default-features = false, features = ["autodiff", "ndarray"] }
burn-core  = "0.16"
burn-cuda  = { version = "0.16", optional = true }
egui_plot  = "0.29"
egui_extras = "0.29"
egui-phosphor = "0.7"   # icon font (matches egui 0.29) for the nav rail + buttons
# ShapeComplexity (EC/MC leaf morphology) — egui-free analysis lib reused for the
# Morphology tab. It pins image 0.24 internally; we only cross the boundary with
# raw RGBA bytes + scalars (see leaf_complex_rust::analyze), so the version differs
# harmlessly from our image 0.25.
# Vendored, not a sibling path: `../ShapeComplexity` meant nobody could clone
# this repo and build it — not a collaborator, not CI, not a reviewer. Kept as a
# copy rather than a git submodule because the upstream repo has uncommitted work
# (including src/gui_api.rs, which this crate needs), so a submodule would pin a
# commit that does not compile. Re-sync with scripts/sync_vendor.ps1.
leaf_complex_rust_lib = { path = "vendor/ShapeComplexity", package = "leaf_complex_rust" }
# ONNX Runtime — always compiled in now. DINOv3/YOLO26 still default to the
# BURN reimplementations (see `ort-backend` above for switching those two to
# ort); Field Review's interactive SAM click tool has no BURN port and uses
# ort unconditionally (SAM's ViT encoder + prompt/mask decoder are a separate,
# much larger reimplementation project — not undertaken, see sam.rs's doc
# comment). 2.x is prerelease so pin explicitly.
ort        = { version = "=2.0.0-rc.10" }
# Pure-Rust weight loading for the hand-written BURN DINOv3 reimplementation
# (port/ → dino_burn.rs). No burn-import; we map safetensors → burn Tensors by name.
safetensors = "0.4"
argmin = "0.10"
argmin-math = { version = "0.4", features = ["vec"] }

# winres embeds the .exe icon and is Windows-only. Target-gated so a Linux or
# macOS build does not pull in and compile a crate it can never use — build.rs
# already guards the call site with #[cfg(target_os = "windows")].
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
